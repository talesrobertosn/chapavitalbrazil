name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main, claude/festive-meitner-4p4naa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sem domínio próprio: /chapavitalbrazil/ e o endereço do GitHub Pages.
      # Ao ativar chapavitalbrazil.com.br, troque para BASE_PATH: / e
      # SITE_URL: https://chapavitalbrazil.com.br (e crie public/CNAME).
      BASE_PATH: /chapavitalbrazil/
      SITE_URL: https://talesrobertosn.github.io/chapavitalbrazil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
